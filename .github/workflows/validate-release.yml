name: Validate published evaluation artifacts
on:
  push:
  pull_request:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate leaderboard and files
        run: python scripts/validate_release.py
      - name: Validate v2.0 comparison data and published task
        run: python scripts/validate_v2_release.py
